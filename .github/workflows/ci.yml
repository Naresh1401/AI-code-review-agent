name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Shared checks from https://github.com/Naresh1401/github-cicd-workflows
jobs:
  python:
    name: Python
    uses: Naresh1401/github-cicd-workflows/.github/workflows/python-ci.yml@v1
    with:
      # The unit tests, then the API smoke test the old workflow ran
      test-command: |
        python -m pytest -q
        python -m uvicorn src.api.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
        for _ in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
          sleep 1
        done
        cat "$RUNNER_TEMP/api.log"
        exit 1

  container:
    name: Docker image
    needs: python
    uses: Naresh1401/github-cicd-workflows/.github/workflows/container.yml@v1

  repo-lint:
    name: Repository lint
    uses: Naresh1401/github-cicd-workflows/.github/workflows/repo-lint.yml@v1
